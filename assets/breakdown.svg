<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <title>JROtto5 - activity breakdown</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="0.55" stop-color="#120a1c"/>
      <stop offset="1" stop-color="#1a0610"/>
    </linearGradient>
    <linearGradient id="tp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ef2c8"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff2e63"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2ef2c8" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ef2c8"/>
      <stop offset="1" stop-color="#ff2e63"/>
    </linearGradient>
    <linearGradient id="rfill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ef2c8"/>
      <stop offset="1" stop-color="#ff2e63"/>
    </linearGradient>
    <style>
      .k { font: 600 14px 'DejaVu Sans Mono', Consolas, monospace; letter-spacing: 3px; fill: #2ef2c8; }
      .kp { font: 600 14px 'DejaVu Sans Mono', Consolas, monospace; letter-spacing: 3px; fill: #ff2e63; }
      .lbl { font: 600 12px 'DejaVu Sans Mono', Consolas, monospace; letter-spacing: 3px; fill: #8a8aa0; }
      .sub { font: 600 12px 'DejaVu Sans Mono', Consolas, monospace; letter-spacing: 2px; fill: #6f6f86; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .in { animation: in .9s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .fade { animation: fade 1.2s ease-out both; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .val { font: 600 13px 'DejaVu Sans Mono', Consolas, monospace; letter-spacing: 1px; fill: #c9c9d6; }
      .pc { fill: #ffffff; font-weight: 700; }
      .gnum { font: 800 46px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; fill: #ffffff; }
      .pnum { font: 800 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; }
      .radar { transform-origin: 300px 230px; animation: pop 1.1s cubic-bezier(.2,.8,.2,1) .2s both; }
      @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { fill-opacity: .16; } 50% { fill-opacity: .3; } }
      .arc { animation: arc 1.8s cubic-bezier(.2,.8,.2,1) .5s both; }
      @keyframes arc { from { stroke-dashoffset: 501.0; } to { stroke-dashoffset: 0; } }
    </style>
