    <style>
      .k { font: 600 14px 'DejaVu Sans Mono', Consolas, monospace; letter-spacing: 3px; fill: #2ef2c8; }
      .kp { font: 600 14px 'DejaVu Sans Mono', Consolas, monospace; letter-spacing: 3px; fill: #ff2e63; }
      .lbl { font: 600 12px 'DejaVu Sans Mono', Consolas, monospace; letter-spacing: 3px; fill: #8a8aa0; }
      .sub { font: 600 12px 'DejaVu Sans Mono', Consolas, monospace; letter-spacing: 2px; fill: #6f6f86; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .in { animation: in .9s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .fade { animation: fade 1.2s ease-out both; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .val { font: 600 12px 'DejaVu Sans Mono', Consolas, monospace; letter-spacing: 1px; fill: #c9c9d6; }
      .big { font: 800 30px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px; fill: #ff2e63; }
      .grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      .draw { stroke-dasharray: 3000; animation: draw 2.4s ease-out .4s both; }
      @keyframes draw { from { stroke-dashoffset: 3000; } to { stroke-dashoffset: 0; } }
      .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.2s ease-out infinite; }
      @keyframes ping { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
