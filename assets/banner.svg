<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="0.55" stop-color="#120a1c"/>
      <stop offset="1" stop-color="#1a0610"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ef2c8"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff2e63"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2ef2c8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font: 800 88px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 10px; }
      .s { font: 600 21px 'DejaVu Sans Mono', Consolas, monospace; letter-spacing: 4px; fill: #e6e6ef; }
      .k { font: 600 15px 'DejaVu Sans Mono', Consolas, monospace; letter-spacing: 3px; fill: #2ef2c8; }
      .scan { animation: scan 7s linear infinite; }
      @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(320px); } }
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="1200" height="36" fill="#2ef2c8" fill-opacity="0.04"/>
  <path d="M0 266H1200" stroke="#ff2e63" stroke-opacity="0.5"/>
  <path d="M0 34H1200" stroke="#2ef2c8" stroke-opacity="0.35"/>
  <text x="40" y="24" class="k">TYPESCRIPT · PYTHON · THREE.JS · NODE · AWS · POSTGRES</text>
  <text x="1160" y="24" class="k" text-anchor="end">ARCH LINUX</text>
  <g filter="url(#glow)">
    <text x="600" y="152" text-anchor="middle" class="t" fill="url(#title)">JROTTO5</text>
  </g>
  <text x="600" y="206" text-anchor="middle" class="s">GAME &amp; PRODUCT ENGINEER</text>
  <text x="600" y="238" text-anchor="middle" class="k" style="fill:#9aa0b4">REAL-TIME NETCODE · DATA PLATFORMS · AI DEV TOOLING · LINUX</text>
  <text x="40" y="290" class="k">OPEN TO: GAME DEV · PRODUCT ENGINEERING · LINUX/INFRA</text>
  <text x="1160" y="290" class="k" text-anchor="end" style="fill:#ff2e63">I SHIP THINGS</text>
</svg>
